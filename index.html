<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">

<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IDOL AGENCY SIMULATOR">
<meta property="og:title" content="IDOL AGENCY SIMULATOR · 소형 기획사 운영 시뮬레이터">
<meta property="og:description" content="자본금 5,000,000원. 연습생을 뽑고, 데뷔조를 짜고, 7년 전속계약을 버텨내세요.">
<meta property="og:image" content="./og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">

<meta name="twitter:title" content="IDOL AGENCY SIMULATOR · 소형 기획사 운영 시뮬레이터">
<meta name="twitter:description" content="자본금 5,000,000원으로 시작하는 아이돌 기획사 경영 시뮬레이터. 브라우저에서 바로 플레이.">
<meta name="twitter:image" content="./og.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<title>IDOL AGENCY SIMULATOR</title>
</head>
<body>
<style>
:root{
  --ink:#0A0A0B; --ink-soft:#141416; --ink-2:#1B1B1F; --ink-line:#26262A;
  --paper:#FFFFFF; --paper-soft:#F4F4F5; --paper-line:#E4E4E7;
  --neon:#FF1F3D; --neon-dim:#C4162E; --neon-glow:rgba(255,31,61,.35);
  --muted:#8A8A93; --dim:rgba(138,138,147,.62);
  --fan:#FF1F3D;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:14px; line-height:1.55; word-break:keep-all;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.tabular{font-family:var(--mono); font-variant-numeric:tabular-nums}
.kicker{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin:0}
h1,h2,h3,h4{margin:0; letter-spacing:-.02em; font-weight:600}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}
::selection{background:var(--neon); color:#fff}

/* ---------- app frame ---------- */
#app{min-height:100vh; display:flex; flex-direction:column}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:0 18px; height:54px;
  background:rgba(10,10,11,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--ink-line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{
  width:26px; height:26px; border-radius:6px; flex:none;
  background:var(--neon); box-shadow:0 0 18px var(--neon-glow);
  display:grid; place-items:center; font-size:13px; font-weight:800; color:#fff;
}
.co{min-width:0}
.co-n{font-size:14px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw}
.co-s{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase}
.tstats{margin-left:auto; display:flex; align-items:center; gap:0}
.tstat{padding:0 14px; border-left:1px solid var(--ink-line); text-align:right; line-height:1.2}
.tstat:first-child{border-left:0}
.tstat b{display:block; font-family:var(--mono); font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}
.tstat span{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase}
.tstat b.hot{color:var(--neon)}
.tstat b.warn{color:#FFB020}
@media (max-width:640px){
  .topbar{padding:0 12px; gap:8px}
  .tstat{padding:0 8px}
  .tstat b{font-size:12.5px}
  .tstat.hide-sm{display:none}
  .co-n{max-width:30vw; font-size:13px}
}

/* stepper */
.steps{display:flex; gap:0; padding:0 18px; height:38px; align-items:center; border-bottom:1px solid var(--ink-line); background:var(--ink); overflow-x:auto; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex; align-items:center; gap:7px; padding:0 13px 0 0; margin-right:13px; white-space:nowrap; position:relative}
.step:after{content:""; position:absolute; right:0; top:50%; width:6px; height:1px; background:var(--ink-line)}
.step:last-child:after{display:none}
.step i{font-style:normal; font-family:var(--mono); font-size:9.5px; width:16px; height:16px; border-radius:4px; display:grid; place-items:center; border:1px solid var(--ink-line); color:var(--dim)}
.step span{font-size:11.5px; color:var(--dim)}
.step.done i{border-color:rgba(255,31,61,.35); color:var(--neon); background:rgba(255,31,61,.08)}
.step.done span{color:rgba(255,255,255,.55)}
.step.now i{background:var(--neon); border-color:var(--neon); color:#fff; box-shadow:0 0 14px var(--neon-glow)}
.step.now span{color:var(--paper); font-weight:600}

main{flex:1; padding:22px 18px 120px; max-width:1320px; width:100%; margin:0 auto}

/* ---------- generic ---------- */
.hd{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px}
.hd h2{font-size:24px}
.hd .line{flex:1; height:1px; background:var(--ink-line); margin-bottom:9px}
.hd .hint{font-size:12px; color:var(--muted); margin-bottom:4px; text-align:right; max-width:38ch}

.cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:12px; overflow:hidden}
.card>.h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; border-bottom:1px solid var(--ink-line)}
.card>.h h3{font-size:14.5px}
.card>.b{padding:16px}
.card.paper{background:var(--paper); color:var(--ink); border-color:var(--paper-line)}
.card.paper>.h{border-color:var(--paper-line)}
.card.paper .kicker{color:rgba(10,10,11,.55)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 18px; border-radius:6px; border:1px solid var(--ink-line);
  background:transparent; color:var(--paper); font-size:13.5px; font-weight:600;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.04)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--neon); border-color:var(--neon); color:#fff; box-shadow:0 0 0 1px var(--neon),0 0 26px var(--neon-glow)}
.btn.primary:hover{background:var(--neon-dim); border-color:var(--neon-dim)}
.btn.lg{height:48px; padding:0 26px; font-size:15px}
.btn:disabled{opacity:.38; cursor:not-allowed; box-shadow:none; transform:none}
.btn.ghost{border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--paper)}
:focus-visible{outline:2px solid var(--neon); outline-offset:2px}

.field{display:block; margin-bottom:14px}
.field>span{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:6px}
.inp{
  width:100%; height:40px; padding:0 12px; border-radius:6px;
  background:var(--ink-2); border:1px solid var(--ink-line); color:var(--paper); font-size:14px;
}
.inp:focus{border-color:var(--neon); outline:none}
select.inp{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.hintline{font-size:11.5px; color:var(--muted); margin:-8px 0 14px}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.distgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
@media (max-width:760px){.distgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.distcard{
  text-align:left; padding:10px 11px; border-radius:8px; border:1px solid var(--ink-line);
  background:var(--ink-2); color:var(--muted); transition:.14s; display:flex; flex-direction:column; gap:3px;
}
.distcard b{font-size:12.5px; font-weight:600; color:inherit}
.distcard span{font-size:11px; color:var(--dim)}
.distcard:hover{border-color:rgba(255,255,255,.28); color:var(--paper)}
.distcard.on{border-color:var(--neon); background:rgba(255,31,61,.09); color:var(--paper)}
.distcard.on span{color:var(--neon)}
.chip{
  padding:7px 12px; border-radius:6px; border:1px solid var(--ink-line);
  background:var(--ink-2); color:var(--muted); font-size:12.5px; transition:.14s;
}
.chip:hover{color:var(--paper); border-color:rgba(255,255,255,.25)}
.chip.on{background:rgba(255,31,61,.1); border-color:var(--neon); color:var(--paper); font-weight:600}

.tag{display:inline-block; padding:2px 7px; border-radius:4px; font-size:10.5px; font-family:var(--mono); letter-spacing:.04em; border:1px solid var(--ink-line); color:var(--muted)}
.tag.neon{border-color:rgba(255,31,61,.4); background:rgba(255,31,61,.1); color:var(--neon)}
.tag.fan{border-color:var(--fan); color:var(--fan); background:color-mix(in srgb,var(--fan) 12%,transparent)}

.bar{height:4px; border-radius:3px; background:var(--ink-line); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--neon); border-radius:3px; transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar.calm>i{background:var(--muted)}
.bar.warn>i{background:#FFB020}

.prange{-webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:3px; background:var(--ink-line); outline:none}
.prange::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--neon); border:2px solid var(--ink-soft); box-shadow:0 0 10px var(--neon-glow); cursor:pointer}
.prange::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--neon); border:2px solid var(--ink-soft); cursor:pointer}
.stackbar{display:flex; height:9px; margin-top:13px; border-radius:4px; overflow:hidden; border:1px solid var(--ink-line)}
.stackbar span{display:block; transition:width .25s}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr}}

.metric{border:1px solid var(--ink-line); border-radius:10px; padding:13px 14px; background:var(--ink-2)}
.metric .v{font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-.02em; margin-top:5px}
.metric .v.hot{color:var(--neon)}
.metric .s{font-size:11.5px; color:var(--muted); margin-top:4px}

/* ---------- intro ---------- */
.intro{min-height:100vh; display:grid; place-items:center; text-align:center; padding:30px 20px; position:relative; overflow:hidden}
.intro .glowbg{position:absolute; width:640px; height:640px; border-radius:50%; background:radial-gradient(circle,rgba(255,31,61,.18),transparent 62%); filter:blur(20px); animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1); opacity:.85}50%{transform:scale(1.12); opacity:1}}
.intro .in{position:relative; max-width:560px}
.intro .kick{font-family:var(--mono); font-size:11px; letter-spacing:.4em; color:var(--neon); text-transform:uppercase}
.intro h1{font-size:clamp(30px,7vw,52px); line-height:1.06; margin:14px 0 0; letter-spacing:-.035em}
.intro h1 em{font-style:normal; color:var(--neon); text-shadow:0 0 34px var(--neon-glow)}
.intro .sub{color:var(--muted); margin:18px auto 0; font-size:14px; max-width:44ch}
.intro .cine{margin:26px auto 0; min-height:52px; font-size:13.5px; color:rgba(255,255,255,.8)}
.intro .cine p{margin:0 0 6px; opacity:0; animation:fadein .7s forwards}
@keyframes fadein{to{opacity:1}}
.intro .acts{margin-top:30px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* ---------- roster ---------- */
.tcard{
  border:1px solid var(--ink-line); border-radius:10px; background:var(--ink-2);
  padding:12px; display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  color:inherit; transition:.15s;
}
.tcard.sel{border-color:var(--neon); background:rgba(255,31,61,.07)}
.tcard.pick{cursor:pointer}
.tcard.pick:hover{border-color:rgba(255,255,255,.3)}
.av{width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:15px; font-weight:700; color:#fff}
.tinfo{min-width:0; flex:1}
.tname{font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.tmeta{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:2px}
.tov{text-align:right; flex:none}
.tov b{display:block; font-family:var(--mono); font-size:19px; font-weight:600; line-height:1}
.statrow{display:grid; grid-template-columns:26px 1fr 26px; gap:7px; align-items:center; margin-top:5px; font-family:var(--mono); font-size:10px; color:var(--dim)}
.statrow .n{text-align:right; color:rgba(255,255,255,.75)}

/* ---------- schedule board ---------- */
.slots{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:640px){.slots{grid-template-columns:1fr}}
.slot{
  min-height:92px; border-radius:10px; border:1px dashed var(--ink-line);
  background:var(--ink-2); padding:12px; text-align:left; color:inherit;
  display:flex; flex-direction:column; justify-content:center; gap:5px; transition:.15s;
}
.slot.empty{color:var(--dim); align-items:center; justify-content:center; text-align:center; font-size:12px}
.slot.full{border-style:solid; border-color:rgba(255,31,61,.42); background:rgba(255,31,61,.06)}
.slot .sl-n{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
.slot .sl-t{font-size:14px; font-weight:600}
.slot .sl-d{font-size:11px; color:var(--muted)}
.slot.full:hover{border-color:var(--neon)}

.palette{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:9px}
.prog{
  border:1px solid var(--ink-line); border-radius:9px; background:var(--ink-2);
  padding:11px 12px; text-align:left; color:inherit; transition:.14s;
}
.prog:hover:not(:disabled){border-color:var(--neon); background:rgba(255,31,61,.06)}
.prog:disabled{opacity:.35; cursor:not-allowed}
.prog b{display:block; font-size:13px; font-weight:600}
.prog small{display:block; font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.45}
.prog .fx{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px}
.fxpill{font-family:var(--mono); font-size:9.5px; padding:1px 5px; border-radius:3px; border:1px solid var(--ink-line); color:var(--dim)}
.fxpill.up{color:var(--neon); border-color:rgba(255,31,61,.3)}
.fxpill.tire{color:#FFB020; border-color:rgba(255,176,32,.3)}

.recap{display:flex; flex-direction:column; gap:8px}
.rline{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--ink-line)}
.rline:last-child{border-bottom:0}
.rline .d{font-family:var(--mono); font-size:12px; color:var(--neon)}

/* ---------- phone ---------- */
#phone{
  position:fixed; right:16px; bottom:78px; z-index:60;
  width:296px; max-width:calc(100vw - 32px);
  border-radius:22px; background:#0d0d10; border:1px solid #2c2c33;
  box-shadow:0 18px 60px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.04);
  overflow:hidden; display:none; flex-direction:column;
}
#phone.on{display:flex}
.ph-notch{height:20px; display:grid; place-items:center}
.ph-notch i{display:block; width:56px; height:5px; border-radius:3px; background:#26262c}
.ph-hd{display:flex; align-items:center; gap:8px; padding:6px 13px 9px; border-bottom:1px solid #1f1f25}
.ph-hd b{font-size:12.5px; font-weight:700; letter-spacing:-.01em}
.ph-live{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; color:var(--neon); margin-left:auto}
.ph-live i{width:5px; height:5px; border-radius:50%; background:var(--neon); animation:blip 1.4s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.ph-x{margin-left:6px; background:none; border:0; color:var(--muted); font-size:15px; line-height:1; padding:2px 4px}
.ph-feed{height:290px; overflow-y:auto; padding:8px 11px 12px; scrollbar-width:thin}
.ph-feed::-webkit-scrollbar{width:4px}
.ph-feed::-webkit-scrollbar-thumb{background:#2a2a31; border-radius:3px}
.post{display:flex; gap:8px; padding:9px 0; border-bottom:1px solid #191920; animation:slidein .38s cubic-bezier(.22,1,.36,1)}
.post:last-child{border-bottom:0}
@keyframes slidein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.post .pa{width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:10px; font-weight:700; color:#fff}
.post .pb{min-width:0; flex:1}
.post .pn{font-size:11px; font-weight:600; display:flex; gap:5px; align-items:baseline}
.post .pn s{text-decoration:none; font-family:var(--mono); font-size:9.5px; color:#5d5d68; font-weight:400}
.ptag{font-family:var(--mono); font-size:8px; letter-spacing:.06em; padding:1px 4px; border-radius:3px; border:1px solid; white-space:nowrap}
.ptag.pos{color:var(--neon); border-color:rgba(255,31,61,.42); background:rgba(255,31,61,.09)}
.ptag.neg{color:#FFB020; border-color:rgba(255,176,32,.42); background:rgba(255,176,32,.09)}
.post.pos{box-shadow:inset 2px 0 0 rgba(255,31,61,.55)}
.post.neg{box-shadow:inset 2px 0 0 rgba(255,176,32,.55)}
.post.pos,.post.neg{margin:0 -11px; padding:9px 11px}
.post .pt{font-size:11.5px; line-height:1.5; color:#d6d6dc; margin-top:2px}
.post .pm{display:flex; gap:12px; margin-top:5px; font-family:var(--mono); font-size:9px; color:#5d5d68}
.post .pm b{color:var(--neon); font-weight:500}
.post.hot{background:linear-gradient(90deg,rgba(255,31,61,.07),transparent); margin:0 -11px; padding:9px 11px}
.ph-empty{padding:36px 14px; text-align:center; color:#4e4e58; font-size:11.5px}
#phoneBtn{
  position:fixed; right:16px; bottom:78px; z-index:59;
  width:52px; height:52px; border-radius:50%; border:1px solid var(--ink-line);
  background:var(--ink-soft); color:var(--paper); font-size:19px; display:none; place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
#phoneBtn.on{display:grid}
#phoneBtn .badge{
  position:absolute; top:-3px; right:-3px; min-width:19px; height:19px; padding:0 5px;
  border-radius:10px; background:var(--neon); color:#fff; font-family:var(--mono); font-size:10px;
  display:grid; place-items:center; box-shadow:0 0 14px var(--neon-glow);
}
@media (max-width:520px){
  #phone{right:10px; width:calc(100vw - 20px)}
  .ph-feed{height:220px}
}
/* On wide screens the open phone reserves its own column instead of covering cards. */
@media (min-width:1080px){ body.ph-open main{padding-right:328px} }

/* ---------- footer CTA ---------- */
.cta{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:12px 18px; background:rgba(10,10,11,.94); backdrop-filter:blur(12px);
  border-top:1px solid var(--ink-line);
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

}

function cnt(n,u){
  n=Math.round(n);

/** 파트 합은 항상 100. 하나를 건드리면 나머지가 비례로 흡수합니다. */
function rebalanceParts(id, val){
  const ids = S.group.members, parts = S.album.parts;
  val = clamp(Math.round(val), 0, 100);
  const others = ids.filter(x=>x!==id);
  if(!others.length){ parts[id] = 100; return; }
  const restOld = others.reduce((n,x)=>n+(parts[x]||0), 0);
  const restNew = 100 - val;
  others.forEach(x=>{ parts[x] = restOld>0 ? Math.round((parts[x]||0)/restOld*restNew) : Math.round(restNew/others.length); });
  parts[id] = val;
  const drift = 100 - ids.reduce((n,x)=>n+(parts[x]||0), 0);
  if(drift){ const big = others.slice().sort((a,b)=>parts[b]-parts[a])[0] || id; parts[big] = clamp(parts[big]+drift, 0, 100); }
}
function evenParts(){
  const ids = S.group.members, base = Math.floor(100/ids.length);
  S.album.parts = {};
  ids.forEach(x=> S.album.parts[x] = base);
  S.album.parts[ids[0]] += 100 - base*ids.length;
}
/** 파트를 잘 맞는 멤버에게 주면 곡이 좋아집니다. */
function partScore(){
  const ms = memberList(); if(!ms.length) return 50;
  let v = 0;
  ms.forEach(m=>{
    const share = (S.album.parts[m.id]||0)/100;
    const fit = m.stats.vocal*0.42 + m.stats.rap*0.18 + m.stats.charisma*0.22 + m.stats.dance*0.18;
    v += share * fit;
  });
  return Math.round(v);
}
/** 분배가 고르면 팀이 안정되고, 쏠리면 화제는 되지만 사이가 상합니다. */
function partSpread(){
  const ms = memberList(); if(ms.length<2) return 0;
  const even = 100/ms.length;
  const dev = ms.reduce((n,m)=>n+Math.abs((S.album.parts[m.id]||0)-even),0)/ms.length;
  return Math.round(dev/even*100);   // 균등 대비 몇 % 벗어났는지
}

function makeTrainee(name, gender, pos, age){
  const gr = (()=>{ let r=rnd()*100, acc=0; for(const g of GRADES){acc+=g.w; if(r<acc) return g;} return GRADES[GRADES.length-1]; })();
  const st = {};
  STAT_KEYS.forEach(k => st[k] = ri(26,44));
  const bias = POSITIONS[pos].bias;
  for(const k in bias) st[k] = clamp(st[k] + bias[k] + ri(-3,4), 20, 78);
  return {
    id:"t"+Math.random().toString(36).slice(2,8),
    name, gender, pos, stats:st, fat:0, age: clamp(age||18, 14, 35),
    grade:gr.g, mult:gr.mult, cap:gr.cap,
    color:`hsl(${ri(0,359)} 62% 52%)`,
  };
}

function groupAvg(){

  const o={}; STAT_KEYS.forEach(k=>o[k]=Math.round(ms.reduce((s,t)=>s+t.stats[k],0)/ms.length));
  o.overall = Math.round(STAT_KEYS.reduce((s,k)=>s+o[k],0)/6);

}

function fanPost(kind, extra){
  const ms = memberList();
  const m  = ms.length ? pick(ms).name : (S.trainees.length ? pick(S.trainees).name : "멤버");
  const g  = S.group ? S.group.name : (S.company.name || "우리 그룹");
  const pool = POSTS[kind] || POSTS.own;
  let raw = pick(pool);
  for(let i=0; i<4 && S.posts[0] && S.posts[0].raw===raw && pool.length>1; i++) raw = pick(pool);
  const fc = featuredChem();
  const txt = raw.replace("{m}", m).replace("{g}", g)
                 .replace("{s}", fc ? fc.ship : "우리 케미")
                 .replace("{n}", extra != null ? Math.round(extra).toLocaleString() : "");
  if(S.rivals.length && rnd() < 0.16){
    const rv = pick(S.rivals);
    return {h: pick(HANDLES)+ri(11,99), raw:"__rival",
            txt: pick([`${rv.name}랑 비교하는 글 좀 그만 봤으면`, `${rv.name} 팬인데 ${g} 이번 곡은 인정합니다`,
                       `${rv.name}보다 ${g}가 라이브는 낫다고 본다`, `${g}랑 ${rv.name} 무대 연달아 보는 중`]),
            like: ri(20, 60 + Math.round(S.fan/10)), rt: ri(2, 12), hot: rnd()<0.2,
            color:`hsl(${ri(0,359)} 55% 50%)`};
  }
  const h  = pick(HANDLES) + ri(11,99);
  return {
    h, txt, raw,
    like: ri(12, 40 + Math.round(S.fan/9)),
    rt:   ri(1, 8 + Math.round(S.fan/70)),
    hot:  rnd() < 0.16,
    color:`hsl(${ri(0,359)} 55% 50%)`,
  };
}
/** 사건 선택 직후의 여론. 선택이 팬덤을 깎았으면 비판이 더 많이 올라옵니다. */
function pushVoices(voice, fx){
  if(!voice) return;
  const harsh = fx && (((fx.fanPct||0) < 0) || ((fx.loyal||0) < 0));
  const take = (arr, n) => {
    const a = arr.slice(), out = [];
    for(let i=0;i<n && a.length;i++) out.push(a.splice(Math.floor(rnd()*a.length),1)[0]);
    return out;
  };
  const items = take(voice.pos||[], harsh?1:2).map(t=>({tone:"pos", txt:t}))
        .concat(take(voice.neg||[], harsh?2:1).map(t=>({tone:"neg", txt:t})));
  for(let i=items.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
  items.forEach((it,i)=> setTimeout(()=>{
    S.posts.unshift({h: pick(HANDLES)+ri(11,99), raw:"__voice", txt: it.txt, tone: it.tone,
                     like: ri(30, 120 + Math.round(S.fan/8)), rt: ri(3, 24), hot:false,
                     color:`hsl(${ri(0,359)} 55% 50%)`});
    S.posts = S.posts.slice(0,70); S.unread++; drawPhone(); save();
  }, 360*i + 260));
}

function pushPosts(kind, n, extra, stagger){
  for(let i=0;i<n;i++){
    const p = fanPost(kind, extra);
    if(stagger){
      setTimeout(()=>{ S.posts.unshift(p); S.posts=S.posts.slice(0,70); S.unread++; drawPhone(); save(); }, 320*i + 120);
    } else {
      S.posts.unshift(p); S.unread++;
    }
  }
  if(!stagger){ S.posts=S.posts.slice(0,70); drawPhone(); }
}

const relKey = (a,b) => [a,b].sort().join("|");
function makeRels(ids){
  const out = [];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const t = pick(REL_TYPES);
    out.push({k:relKey(ids[i],ids[j]), a:ids[i], b:ids[j], type:t.id,
              aff: ri(t.base[0], t.base[1]), origin: pick(ORIGINS[t.id]), heat: ri(0,30), flags:{}});
  }
  return out;
}
/** 새 멤버가 합류하면 기존 멤버들과의 관계를 만들어 줍니다. */
function syncRels(){
  if(!S.group) return;
  const ids = S.group.members;
  const have = new Set(S.rels.map(r=>r.k));
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const k = relKey(ids[i], ids[j]);
    if(have.has(k)) continue;
    const t = pick(REL_TYPES);
    S.rels.push({k, a:ids[i], b:ids[j], type:t.id, aff:ri(t.base[0], t.base[1]),
                 origin: pick(ORIGINS[t.id]), heat: ri(0,20), flags:{}});
  }
  S.rels = S.rels.filter(r => ids.includes(r.a) && ids.includes(r.b));
}
const relOf = (a,b) => S.rels.find(r=>r.k===relKey(a,b));
function shipName(n1,n2){ return (n1.slice(1,2)||n1.slice(0,1)) + (n2.slice(1,2)||n2.slice(0,1)); }
/** 대표가 직접 지정한 대표 케미. 지정 전에는 없습니다. */
function featuredChem(){
  if(!S || !S.pushShip || !S.rels) return null;
  const r = S.rels.find(x=>x.k===S.pushShip);
  if(!r) return null;
  const A=T(r.a), B=T(r.b);
  if(!A || !B) return null;
  return {r, A, B, ship: shipName(A.name, B.name)};
}
/** 지정 전 참고용으로 보여줄 자연 발생 1순위. */
function hottestChem(){
  const scored = S.rels.map(r=>{
    const A=T(r.a), B=T(r.b); if(!A||!B) return null;
    return {r, A, B, score: r.aff*0.6 + r.heat*1.4, ship: shipName(A.name, B.name)};
  }).filter(Boolean).sort((x,y)=>y.score-x.score);
  return scored[0] || null;
}
function relLabel(t){ return (REL_TYPES.find(x=>x.id===t)||{label:"—"}).label; }

/** Effects are plain data so a modal survives a page reload. */
function applyFx(fx){
  if(!fx) return;
  if(fx.money) S.money += fx.money;
  if(fx.fan)   S.fan   = Math.max(0, S.fan + fx.fan);
  if(fx.fanPct)S.fan   = Math.max(0, Math.round(S.fan * (1+fx.fanPct)));
  if(fx.loyal) S.loyal = clamp(S.loyal + fx.loyal, 5, 100);
  if(fx.buzz)  S.buzz  = clamp(S.buzz  + fx.buzz, 0, 100);
  if(fx.aware) S.aware = clamp(S.aware + fx.aware, 0, 100);
  if(fx.fat)   memberList().forEach(t=> t.fat = clamp(t.fat + fx.fat, 0, 100));
  if(fx.relAll) S.rels.forEach(r=> r.aff = clamp(r.aff + fx.relAll, -100, 100));
  if(fx.rel){ const r = S.rels.find(x=>x.k===fx.rel.k); if(r) r.aff = clamp(r.aff + fx.rel.d, -100, 100); }
  if(fx.heat){ const r = S.rels.find(x=>x.k===fx.heat.k); if(r) r.heat = clamp(r.heat + fx.heat.d, 0, 100); }
  if(fx.posts) pushPosts(fx.posts.kind || "own", fx.posts.n || 2, null, true);
}

/* ================= chrome ================= */
const STEPS_FIRST = [
  {id:"company", n:"설립"}, {id:"recruit", n:"모집"}, {id:"training", n:"트레이닝"},
  {id:"debut", n:"데뷔조"}, {id:"produce", n:"제작"}, {id:"promo", n:"활동"}, {id:"results", n:"정산"},
];
const STEPS_LOOP = [
  {id:"hub", n:"사무실"}, {id:"training", n:"트레이닝"}, {id:"produce", n:"제작"},
  {id:"promo", n:"활동"}, {id:"results", n:"정산"},
];
const steps = () => ((S.cycle>1 || S.phase==="hub" || S.phase==="ending") ? STEPS_LOOP : STEPS_FIRST);
/** 계약 잔여를 "3년 6개월" 꼴로. */
function termLeft(){
  const total=S.contractYears*12, left=Math.max(0,total-S.months);
  return {left, y:Math.floor(left/12), m:left%12, elapsedY:Math.floor(S.months/12), elapsedM:S.months%12,
          cyclesLeft: Math.floor(left/MONTHS_PER_CYCLE), expired: left<MONTHS_PER_CYCLE};
}
function chrome(inner, cta){
  const ST = steps(), t = termLeft();
  const idx = S.phase==="ending" ? ST.length : ST.findIndex(s=>s.id===S.phase);
  const weekTxt =
    S.phase==="training" ? `연습 ${S.trainWeek}/4주` :
    S.phase==="promo"    ? `활동 ${S.promoWeek}/4주` :
    S.phase==="results"  ? "정산" : S.phase==="hub" ? "공백기" : "—";
  const stats = [
    {k:"자금", v:wonShort(S.money), cls: S.money<0 ? "hot" : S.money<500000 ? "warn" : ""},
    S.fan>0 ? {k:"팬덤", v:cnt(S.fan,"명"), cls:"hot"} : null,
    S.group ? {k:"계약", v:`${t.y}년 ${t.m}개월`, cls: t.expired ? "warn" : ""} : null,
    {k:"주차", v:weekTxt, cls:"", sm:true},
  ].filter(Boolean);

  return `
  <header class="topbar">
    <div class="brand">
      <div class="mark">IA</div>
      <div class="co">
        <div class="co-n">${S.company.name ? esc(S.company.name) : "IDOL AGENCY"}</div>
        <div class="co-s">${S.group ? esc(S.group.name)+" · "+S.cycle+"번째 컴백" : "SIMULATOR"}</div>
      </div>
    </div>
    <div class="tstats">
      ${stats.map(s=>`<div class="tstat${s.sm?" hide-sm":""}"><b class="${s.cls}">${s.v}</b><span>${s.k}</span></div>`).join("")}
    </div>
  </header>
  <nav class="steps" aria-label="진행 단계">
    ${ST.map((s,i)=>`<div class="step ${i<idx?"done":i===idx?"now":""}"><i>${i<idx?"✓":i+1}</i><span>${s.n}</span></div>`).join("")}
  </nav>
  <main>${inner}</main>
  ${cta ? `<div class="cta">
      <div class="txt"><b>${cta.title}</b><span>${cta.sub||""}</span></div>
      ${cta.ghost?`<button class="btn ghost" data-act="${cta.ghost.act}">${cta.ghost.label}</button>`:""}
      <button class="btn primary lg" data-act="${cta.act}" ${cta.disabled?"disabled":""}>${cta.label}</button>
    </div>` : ""}`;
}

/* ================= render ================= */
function render(){
  const app = $("#app");
  app.innerHTML = ({
    intro:vIntro, company:vCompany, recruit:vRecruit, training:vTraining,
    debut:vDebut, produce:vProduce, promo:vPromo, results:vResults,
    hub:vHub, ending:vEnding,
  })[S.phase]();
  renderModal();
  drawPhone();
  const nav=$(".steps"), now=$(".step.now");
  if(nav && now) nav.scrollLeft = Math.max(0, now.offsetLeft - 48);
  window.scrollTo({top:0, behavior:"instant"});
}
function go(p){ S.phase=p; save(); render(); }

                <b>${p.label}</b><small>${p.desc}</small>
                <span class="fx">
                  ${Object.entries(p.gain).map(([s,v])=>`<span class="fxpill up">${STAT_LABELS[s]} +${v}</span>`).join("")}
                  <span class="fxpill ${p.fat>0?"tire":""}">피로 ${p.fat>0?"+":""}${p.fat}</span>
                </span>
              </button>`).join("")}
          </div></div>
        </div>

        ${S.trainLog.length?`<div class="card"><div class="h"><div><p class="kicker">Log</p><h3>지난 주 기록</h3></div></div>
          <div class="b recap">${S.trainLog.slice(-3).reverse().map(l=>`
            <div class="rline"><span class="d">${l.w}주</span><span>${esc(l.txt)}</span><span class="d">+${l.gain}</span></div>`).join("")}</div></div>`:""}
      </div>

      <div style="display:grid; gap:18px">

                <span class="bar ${t.fat>60?"warn":"calm"}"><i style="width:${clamp(t.fat,0,100)}%"></i></span>

     sub:   full ? (S.trainWeek===S.trainWeeks ? (S.cycle>1?"연습이 끝나면 다음 앨범을 제작합니다":"연습이 끝나면 데뷔조를 짭니다") : "다음 주로 넘어갑니다") : "프로그램을 눌러 시간표를 채우세요",
     label: S.trainWeek===S.trainWeeks ? "연습 종료" : `${S.trainWeek}주차 마치기`, act:"train:close", disabled:!full}
  );
}
function projectTraining(plan){
  const gain={}, avgFat = S.trainees.reduce((s,t)=>s+t.fat,0)/Math.max(1,S.trainees.length);
  const eff = clamp(1 - avgFat/165, 0.45, 1);
  let fat=0;
  plan.forEach(k=>{
    const p=TRAIN[k]; fat+=p.fat;
    for(const s in p.gain) gain[s]=(gain[s]||0)+Math.round(p.gain[s]*eff);
  });
  const note = eff<0.7 ? "피로가 높아 성장률이 눌렸습니다. 휴식을 한 타임 넣으세요."
             : eff<0.9 ? "컨디션은 무난합니다."
             : "컨디션이 좋아 성장률이 온전히 반영됩니다.";
  return {gain, fat:Math.round(fat/1.4), eff, note};
}
function closeTrainWeek(){
  const plan=S.trainPlan, avgFat=S.trainees.reduce((s,t)=>s+t.fat,0)/Math.max(1,S.trainees.length);
  const eff = clamp(1 - avgFat/165, 0.45, 1);
  let total=0;
  S.trainees.forEach(t=>{
    plan.forEach(k=>{
      const p=TRAIN[k];
      for(const s in p.gain){
        const room = Math.max(0, t.cap - t.stats[s]);
        const g = Math.round(p.gain[s] * t.mult * eff * clamp(room/26, 0.12, 1));
        t.stats[s] = clamp(t.stats[s]+g, 0, t.cap); total+=g;
      }
      t.fat = clamp(t.fat + p.fat/1.4, 0, 100);
    });
    t.fat = clamp(t.fat - TRAIN_RECOVERY, 0, 100);
  });
  S.chatter = makeChatter(plan, "train");
  S.money -= TRAIN_COST; S.costs.train += TRAIN_COST;
  S.trainLog.push({w:S.trainWeek, txt: plan.map(k=>TRAIN[k].label).join(" · "), gain: total});
  S.trainPlan=[]; S.trainWeek++;
  if(S.trainWeek > S.trainWeeks){
    S.trainWeek = S.trainWeeks;
    if(S.cycle>1){ startAlbum(); go("produce"); } else go("debut");
  } else { save(); render(); }
}

function albumQuality(){
  const a=S.album, g=groupAvg();
  const base = PROD.reduce((s,p)=>s+TIERS.find(t=>t.id===a.tiers[p.id]).q, 0)/PROD.length;
  const skillBonus = Math.round((g.overall - 45)/2.4);
  const partBonus  = Math.round((partScore() - 52)/2.2) + (partSpread()>35 ? -4 : partSpread()<15 ? 2 : 0);
  const per = {};
  PROD.forEach(p=>{ per[p.axis] = TIERS.find(t=>t.id===a.tiers[p.id]).q; });
  return {total: clamp(Math.round(base + skillBonus + partBonus), 5, 100), base:Math.round(base), skillBonus, partBonus, per};
}

  const leader = ms.find(t=>t.pos==="leader");
  const leadBonus = leader ? 1 + clamp(leader.stats.mental/100, 0, 1)*0.18 : 1;   // 리더가 팀 효율을 붙잡습니다
  const eff = clamp(active.length/Math.max(1,ms.length), 0.4, 1)
            * clamp(1 - (ms.reduce((s,t)=>s+t.fat,0)/ms.length)/210, 0.5, 1) * leadBonus;
  const skill = clamp(g.overall/55, 0.6, 1.7);

  // Album sales are front-loaded: 초동 is the number the industry reads.
  const WEEK_MULT = [2.4, 0.9, 0.6, 0.5][S.promoWeek-1];
  const AT = ALBUM_TYPES[S.album.type] || ALBUM_TYPES.mini;
  let sales=0, streams=0, fan=0, buzz=0, aware=0, cash=0;
  plan.forEach(k=>{
    const a=ACTS[k];
    // Fandom→sales conversion saturates, or every cycle would triple the last one.
    const convert     = S.fan * 0.22 / (1 + S.fan/40000);
    const salesBase   = (1200 + convert) * (S.loyal/100) * (q.total/55) * WEEK_MULT;
    const streamBase = 55000 + S.buzz*4500 + S.aware*9000;
    sales   += a.sales  * salesBase  * eff * skill * AT.sales;
    streams += a.stream * streamBase * eff * (0.55 + q.per.song/150) * AT.stream;
    fan     += a.fan    * (300 + S.aware*45 + q.total*11) * eff * skill;
    buzz    += a.buzz   * (4.2 + q.per.buzz/22) * eff;
    // 대중 인지도는 올라갈수록 둔해집니다. 90은 몇 사이클을 들여야 닿는 선입니다.
    aware   += a.aware  * (1.45 + q.per.mv/58) * eff * (1 - S.aware/128);
    if(a.money) cash += a.money;
    if(a.ticket) cash += Math.round(Math.min(S.fan*0.04, 5000) * 9000);
    ms.forEach(t=> t.fat = clamp(t.fat + a.fat*0.66, 0, 100));
  });
  // 함께 붙어 있는 스케줄은 사이를 가깝게, 과로는 멀어지게 만듭니다.
  const warmth = plan.reduce((n,k)=> n + (ACTS[k].fan>=0.9 ? 1 : 0), 0);
  const strain = ms.reduce((n,t)=>n+t.fat,0)/Math.max(1,ms.length) > 70 ? -3 : 0;
  S.rels.forEach(r=>{
    r.aff  = clamp(r.aff + warmth*2 + strain + ri(-2,3), -100, 100);
    r.heat = clamp(r.heat + (warmth?ri(1,5):ri(0,2)) + (plan.includes("own")?3:0), 0, 100);
  });
  const sp = partSpread();
  if(sp > 35) S.rels.forEach(r=> r.aff = clamp(r.aff - 2, -100, 100));
  else if(sp < 15) S.rels.forEach(r=> r.aff = clamp(r.aff + 1, -100, 100));
  if(sp > 35) buzz += 1.6;                   // 몰아주면 화제는 됩니다
  const feat = featuredChem();
  if(feat){                                  // 밀어주는 조합이 화제를 만듭니다
    feat.r.heat = clamp(feat.r.heat + 6, 0, 100);
    feat.r.aff  = clamp(feat.r.aff + 2, -100, 100);
    buzz += 2.6;
    setTimeout(()=> pushPosts("ship", 1, null, true), 900);
  }
  if(S.promoWeek===1){ streams *= 1.5; fan *= 1.7; }
  buzz = S.buzz*0.72 + buzz;  // buzz decays

  ms.forEach(t=> t.fat = clamp(t.fat - PROMO_RECOVERY, 0, 100));
  S.money += cash; S.extraIncome += cash;
  S.sales += sales; S.streams += streams;
  S.fan   += fan;   S.buzz = clamp(buzz,0,100);
  S.aware = clamp(S.aware + aware, 0, 100);
  S.loyal = clamp(S.loyal + (plan.filter(k=>ACTS[k].fan>=0.9).length*3) - 1.5, 20, 100);

  const wcost = PROMO_COST + DISTRICTS[S.company.district].rent/4;
  S.money -= wcost; S.costs.promo += PROMO_COST; S.costs.rent += DISTRICTS[S.company.district].rent/4;

  S.chatter = makeChatter(plan, "promo");
  const chart = weeklyChart();
  S.chart = chart;
  S.logs.push({w:S.promoWeek, acts:plan.map(k=>ACTS[k].label).join(" · "),
    sales:Math.round(sales), fan:Math.round(fan), fanAfter:Math.round(S.fan), buzz:Math.round(S.buzz),
    rank: chart.findIndex(r=>r.me)+1, cash});

  // live fan reactions, staggered
  plan.forEach((k,i)=> setTimeout(()=> pushPosts(k, k==="rest"?1:2, null, true), i*260));
  if(S.promoWeek===1) setTimeout(()=> pushPosts("hype", 1, S.sales, true), 1400);

  S.promoPlan=[]; S.promoWeek++;
  const ev = rollEvent();
  if(S.promoWeek>4){ S.promoWeek=4; S.settledCycle=null; settle(); S.phase="results"; }
  if(ev){ ask(ev); } else { save(); render(); }
}

/* ---------- 7. results ---------- */
/** Debut baseline, then +18% on volume / +15% on profit over the previous album. */
const BASE_TARGET = {sales:22000, streams:3600000, fanGain:15000, profit:20000000};
function targetsFor(last){
  if(!last) return {...BASE_TARGET};
  return {
    sales:   Math.max(BASE_TARGET.sales,   last.sales   * 1.18),
    streams: Math.max(BASE_TARGET.streams, last.streams * 1.18),
    fanGain: Math.max(BASE_TARGET.fanGain, last.fanGain * 1.18),
    profit:  Math.max(BASE_TARGET.profit,  last.profit  * 1.15),
  };
}
const PRICE_ALBUM = 13000, MARGIN_ALBUM = 0.11;
const WON_PER_STREAM = 3.6, MARGIN_STREAM = 0.30;
function settle(){
  const q = albumQuality(), g = groupAvg();
  const grossAlbum  = S.sales * PRICE_ALBUM;
  const grossStream = S.streams * WON_PER_STREAM;
  const eventFee    = S.aware > 45 ? Math.round((S.aware-45) * 260000) : 0;
  const gross = grossAlbum + grossStream + eventFee;

  const settleAlbum  = grossAlbum  * MARGIN_ALBUM;
  const settleStream = grossStream * MARGIN_STREAM;
  const revenue = settleAlbum + settleStream + eventFee + S.extraIncome;

  const spend = S.costs.contract + S.costs.train + S.costs.prod + S.costs.promo + S.costs.rent;
  const profit = revenue - spend;

  // composite score, expanded so the letters actually separate
  const nz = (v,ref) => clamp(v/ref, 0, 1.6);
  // The bar is relative: a debut is measured against the industry baseline, every
  // album after that against the one before it. Otherwise a grown group scores S forever.
  const prevAlbum = S.career.last;
  const ref = targetsFor(prevAlbum);
  const fanGain = Math.max(0, S.fan - S.fanAtCycleStart);
  const raw = nz(S.sales, ref.sales)*0.30 + nz(S.streams, ref.streams)*0.22 + nz(fanGain, ref.fanGain)*0.20
            + nz(S.aware, 70)*0.08 + nz(q.total, 82)*0.08 + nz(profit, ref.profit)*0.12;
  let score = 50 + (raw - 0.60) * 55;
  if(score > 88) score = 88 + (score-88)*0.5;
  score = clamp(Math.round(score), 1, 100);

  const grade = score>=92?"S" : score>=80?"A" : score>=66?"B" : score>=50?"C" : score>=34?"D" : "F";
  const chartRank = S.streams > 2600000 ? Math.max(1, Math.round(100 - (S.streams-2600000)/95000)) : null;

  const line =
    grade==="S" ? "신인상은 이미 확정입니다. 다음 앨범부터가 진짜 승부입니다." :
    grade==="A" ? "업계가 이름을 기억하기 시작했습니다. 잘 만든 데뷔입니다." :
    grade==="B" ? "무난한 데뷔. 팬덤은 남았고, 다음이 있습니다." :
    grade==="C" ? "적자는 면했습니다. 다만 아무도 아직 확신하지 못합니다." :
    grade==="D" ? "숫자가 냉정합니다. 무엇이 부족했는지는 기록에 남아 있습니다." :
                  "이번 앨범은 실패했습니다. 그래도 멤버들은 무대에 섰습니다.";

  const best = memberList().slice().sort((a,b)=>overall(b)-overall(a))[0];
  S.money += revenue;
  const c = S.career;
  c.last = {sales:S.sales, streams:S.streams, fanGain, profit};
  c.cycles++; c.sales += S.sales; c.streams += S.streams; c.revenue += revenue; c.profit += profit;
  c.peakFan = Math.max(c.peakFan, Math.round(S.fan));
  const first = S.logs.length ? S.logs[0].sales : 0;
  c.bestFirst = Math.max(c.bestFirst, Math.round(first));
  if(score >= c.bestScore){ c.bestScore = score; c.bestGrade = grade; }
  S.result = {
    ref, fanGain, prev: prevAlbum,
    grade, score, gross, grossAlbum, grossStream, eventFee,
    revenue, settleAlbum, settleStream, spend, profit, chartRank, line, extra:S.extraIncome,
    best: best ? best.name : "", q:q.total,
    first: S.logs.length ? S.logs[0].sales : 0,
  };
  pushPosts("hype", 2, S.sales, true);
  save();
}

const RENEW_PER_MEMBER = 3000000;

/** Between cycles: 공백기 손실, 회복, 나이. Guarded so a refresh can't run it twice. */
function enterHub(){
  if(S.settledCycle === S.cycle) { go("hub"); return; }
  S.settledCycle = S.cycle;
  S.months += MONTHS_PER_CYCLE;
  S.fan   = Math.round(S.fan * 0.88);          // 공백기 이탈
  S.loyal = clamp(S.loyal - 4, 20, 100);
  S.aware = clamp(S.aware * 0.88, 0, 100);
  S.buzz  = 0;
  S.trainees.forEach(t=>{ t.fat = 0; t.age += MONTHS_PER_CYCLE/12; });
  pushPosts("hiatus", 3);
  go("hub");
}

  S.album.type = t;

  S.album.titleIdx = clamp(S.album.titleIdx, 0, n-1);
  S.album.title = tr[S.album.titleIdx] || "";

/** 관계 패널 — 팬덤 최애 케미를 맨 위에, 그 아래 전체 쌍. */
function relPanel(compact){
  if(!S.rels.length) return "";
  const feat = featuredChem(), hot = hottestChem();
  const rows = S.rels.map(r=>{
    const A=T(r.a), B=T(r.b); if(!A||!B) return null;
    return {r, A, B, ship:shipName(A.name,B.name)};
  }).filter(Boolean).sort((x,y)=>y.r.aff-x.r.aff);
  const show = compact ? rows.slice(0,4) : rows;
  return `<div class="card"><div class="h"><div><p class="kicker">Chemistry</p><h3>멤버 관계</h3></div>
      <span class="tag neon">${S.rels.length}쌍</span></div>
    <div class="b">
      ${feat ? `<div class="ship">
        <p class="kicker">팬덤 최애 케미 · 밀어주는 중</p>
        <div class="ship-row">
          <span class="av" style="width:30px;height:30px;font-size:12px;background:${feat.A.color}">${esc(feat.A.name.slice(0,1))}</span>
          <span class="av" style="width:30px;height:30px;font-size:12px;background:${feat.B.color};margin-left:-9px">${esc(feat.B.name.slice(0,1))}</span>
          <div style="min-width:0;flex:1">
            <div class="ship-n">${esc(feat.ship)} <span class="tag neon">${relLabel(feat.r.type)}</span></div>
            <div class="ship-s">${esc(feat.A.name)} × ${esc(feat.B.name)} · 호감도 ${feat.r.aff} · 화제성 ${feat.r.heat}</div>
          </div>
          <button class="chip" data-push="">해제</button>
        </div>
        <p class="ship-o">${esc(feat.r.origin)}</p>
        <p class="ship-o" style="color:var(--neon)">매주 화제성 +6 · 팬 반응에 ${esc(feat.ship)} 언급이 늘어납니다.</p>
      </div>` : `<div class="ship" style="border-style:dashed; border-color:var(--ink-line); background:transparent">
        <p class="kicker">팬덤 최애 케미 · 미지정</p>
        <p class="ship-o" style="margin-top:7px">밀어줄 조합을 아직 고르지 않았습니다. 아래에서 하나를 지정하면
          자체 콘텐츠와 팬 반응이 그 조합을 중심으로 굴러갑니다.${hot?` 지금 자연스럽게 화제인 건 <b style="color:var(--paper)">${esc(hot.ship)}</b>입니다.`:""}</p>
      </div>`}
      <div style="display:grid; gap:7px; margin-top:12px">
        ${show.map(x=>`<div style="display:grid; grid-template-columns:minmax(0,1fr) 52px auto; gap:8px; align-items:center; font-size:12px">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            <b style="font-weight:600">${esc(x.ship)}</b>
            <span style="color:var(--dim)"> ${esc(x.A.name)}·${esc(x.B.name)} · ${relLabel(x.r.type)} · ${x.r.aff}</span></span>
          <span class="bar ${x.r.aff>=50?"":x.r.aff<0?"warn":"calm"}"><i style="width:${Math.round((clamp(x.r.aff,-100,100)+100)/2)}%"></i></span>
          <button class="chip ${S.pushShip===x.r.k?"on":""}" data-push="${x.r.k}" style="padding:3px 8px; font-size:10.5px">${S.pushShip===x.r.k?"미는 중":"밀기"}</button>
        </div>`).join("")}
        ${compact && rows.length>4 ? `<p style="margin:2px 0 0; font-size:11px; color:var(--muted)">사무실에서 전체 ${rows.length}쌍을 볼 수 있습니다.</p>`:""}
      </div>
      <p style="margin:10px 0 0; font-size:11px; color:var(--muted)">호감도 72 이상 또는 −45 이하가 되면 멤버가 직접 면담을 신청합니다.</p>
    </div></div>`;
}

function makeChatter(plan, kind){
  const ms = kind==="train" ? S.trainees : memberList();
  if(!ms.length) return [];
  const pool = ms.slice();
  const out = [], used = new Set();
  const n = Math.min(3, pool.length);
  const fresh = (arr) => {            // 이번 주에 아직 안 나온 문장을 우선합니다
    const free = arr.filter(x=>!used.has(x));
    return pick(free.length ? free : arr);
  };
  for(let i=0;i<n;i++){
    const m = pool.splice(Math.floor(rnd()*pool.length),1)[0];
    let text = null;
    // 상황이 먼저, 스케줄이 그다음.
    if(m.fat >= 78) text = fresh(SAY_STATE.tired);
    else if(kind!=="train" && S.group && S.group.center===m.id && rnd()<0.3) text = fresh(SAY_STATE.center);
    else if(m.pos==="leader" && rnd()<0.28) text = fresh(SAY_STATE.leader);
    else if(kind!=="train" && S.album && S.album.parts){
      const share = S.album.parts[m.id]||0, even = 100/Math.max(1,memberList().length);
      if(share >= even+12 && rnd()<0.35) text = fresh(SAY_STATE.bigPart);
      else if(share <= even-12 && rnd()<0.45) text = fresh(SAY_STATE.noPart);
    }
    if(!text && m.fat <= 18 && rnd()<0.3) text = fresh(SAY_STATE.fresh);
    if(!text){
      const k = pick(plan.filter(x=>SAY[x])) || pick(Object.keys(SAY));
      text = fresh(SAY[k] || SAY.own);
    }
    // 관계가 뚜렷하면 상대를 언급합니다.
    if(rnd() < 0.32 && S.rels.length){
      const mine = S.rels.filter(r=> r.a===m.id || r.b===m.id);
      if(mine.length){
        const r = mine.slice().sort((x,y)=>Math.abs(y.aff)-Math.abs(x.aff))[0];
        const other = T(r.a===m.id ? r.b : r.a);
        if(other){
          text = r.aff >= 55 ? pick([`${other.name}${josa(other.name,"과와").slice(-1)} 같이 하면 확실히 덜 힘들어요.`,
                                     `요즘 ${josa(other.name,"이가")} 저를 제일 많이 챙겨줘요.`,
                                     `${other.name} 없었으면 못 버텼을 거예요.`])
               : r.aff <= -40 ? pick([`${other.name}${josa(other.name,"과와").slice(-1)} 파트 맞추는 게 아직 어색해요.`,
                                      `${other.name} 얘기는… 지금은 안 할래요.`,
                                      `무대에서는 티 안 내려고 노력하고 있어요.`])
               : text;
        }
      }
    }
    used.add(text);
    out.push({id:m.id, name:m.name, color:m.color, text});
  }
  return out;
}
function chatterPanel(kicker, title){
  if(!S.chatter || !S.chatter.length) return "";
  return `<div class="card"><div class="h"><div><p class="kicker">${kicker}</p><h3>${title}</h3></div></div>
    <div class="b" style="display:grid; gap:11px">
      ${S.chatter.map(c=>`<div class="say">
        <span class="av" style="width:26px;height:26px;font-size:10px;background:${c.color}">${esc(c.name.slice(0,1))}</span>
        <div><div class="say-n">${esc(c.name)}</div><p class="say-t">"${esc(c.text)}"</p></div>
      </div>`).join("")}
    </div></div>`;
}

  if(!warm.length || rnd() > 0.42) return null;
  const r = pick(warm), A = T(r.a), B = T(r.b);
  if(!A || !B) return null;
  r.flags["out"+S.cycle] = true;
  const o = pick(OUTINGS), ship = shipName(A.name, B.name);
  return {kind:"event", tone:"good", kicker:"Off duty · 사적 일정",
    title:`${A.name} × ${B.name} · ${o.p}`,
    body:`${o.d}<br><br>팬들은 벌써 <b>${esc(ship)}</b>라는 이름을 붙였습니다.

/** 상담이 우선, 그다음 가중 추첨. 활동이 커질수록 사건도 잦아집니다. */
function rollEvent(){
  if(!S.group) return null;
  const c = counselEvent(); if(c) return c;
  const bo = bondEvent();     if(bo) return bo;
  const chance = clamp(0.30 + S.aware/260 + Math.min(S.fan, 120000)/460000, 0, 0.72);
  if(rnd() > chance) return null;
  const cands = DECK.filter(e=> e.when() && !(S.seenEvents||[]).includes(e.id + ":" + S.cycle));
  if(!cands.length) return null;
  const total = cands.reduce((n,e)=>n+e.w, 0);
  let r = rnd()*total;
  for(const e of cands){ r -= e.w; if(r<=0){ (S.seenEvents = S.seenEvents||[]).push(e.id + ":" + S.cycle); return e.build(); } }
  return null;
}

/* ================= events ================= */
const CLICK_TARGETS = ["act","dist","pos","prog","clear","pickid","center","color","tier","actv",
  "center2","join","leave","choice","push","atype","titleidx"].map(k=>`[data-${k}]`).join(",");
document.addEventListener("click", e=>{
  // 위임 대상은 한곳에서 관리합니다 — 새 data-* 액션을 추가할 때 여기에 꼭 넣으세요.
  const el = e.target.closest(CLICK_TARGETS);
  if(!el) return;

  if(el.dataset.dist){ S.company.district=el.dataset.dist; save(); render(); return; }
  if(el.dataset.pos){ lastPos=el.dataset.pos; $$("#nPos .chip").forEach(c=>c.classList.toggle("on", c===el)); return; }
  if(el.dataset.prog){ if(S.trainPlan.length<3){ S.trainPlan.push(el.dataset.prog); save(); render(); } return; }
  if(el.dataset.actv){ if(S.promoPlan.length<3){ S.promoPlan.push(el.dataset.actv); save(); render(); } return; }
  if(el.dataset.clear!=null){ (S.phase==="training"?S.trainPlan:S.promoPlan).splice(+el.dataset.clear,1); save(); render(); return; }
  if(el.dataset.pickid){
    const d=draft(), id=el.dataset.pickid, i=d.members.indexOf(id);
    if(i>=0){ d.members.splice(i,1); if(d.center===id) d.center=null; }
    else if(d.members.length<7) d.members.push(id);
    syncDebut(); render(); return;
  }
  if(el.dataset.center){ draft().center=el.dataset.center; syncDebut(); render(); return; }
  if(el.dataset.color){ draft().color=el.dataset.color; syncDebut(); render(); return; }
  if(el.dataset.tier){ const [p,t]=el.dataset.tier.split(":"); S.album.tiers[p]=t; syncAlbum(); save(); render(); return; }
  if(el.dataset.atype){ syncTracks(); setAlbumType(el.dataset.atype); save(); render(); return; }
  if(el.dataset.titleidx != null){ syncTracks(); S.album.titleIdx = +el.dataset.titleidx;
    S.album.title = S.album.tracks[S.album.titleIdx] || ""; save(); render(); return; }
  if(el.dataset.push != null){ S.pushShip = el.dataset.push || null; save(); render(); return; }
  if(el.dataset.center2){ S.group.center=el.dataset.center2; save(); render(); return; }
  if(el.dataset.join){ if(S.group.members.length<7){ S.group.members.push(el.dataset.join); syncRels(); save(); render(); } return; }
  if(el.dataset.leave){
    if(S.group.members.length<=4) return;
    const id=el.dataset.leave;
    S.group.members = S.group.members.filter(x=>x!==id);
    if(S.group.center===id) S.group.center = S.group.members[0];
    syncRels(); save(); render(); return;
  }

  if(el.dataset.choice != null){ chooseModal(+el.dataset.choice); return; }
  perform(el.dataset.act);
});

function chooseModal(i){
  const m = S.modal, c = m && m.choices && m.choices[i];
  if(!c) return;
  if(m.kind === "event"){
    applyFx(c.fx);
    // 여론은 결과창을 닫은 뒤에 흐릅니다 — 모달에 가려지면 보이지 않으니까요.
    ask({kind:"note", kicker:m.kicker, tone:c.danger?"bad":m.tone, title:"결과", body:c.result,
         voice:c.voice, vfx:c.fx, choices:[{label:"확인하고 여론 보기"}]});
    return;
  }
  if(m.kind === "note" && m.voice){
    if(!phoneOpen && phoneAvailable()) phoneOpen = true;   // 여론은 보여야 의미가 있습니다
    closeModal();
    pushVoices(m.voice, m.vfx);
    return;
  }
  if(m.kind === "confirm"){ const act = c.act; closeModal(); if(act) perform(act); return; }
  closeModal();
  if(S.phase === "results" && !S.result) return;
}

function perform(act){
  switch(act){
    case "start":  S=blank(); S.seed=Date.now()|0; go("company"); break;
    case "resume": S=loadSave()||blank(); phoneOpen = window.innerWidth >= 1080; render(); break;
    case "company:submit":
      readCompany();
      if(!S.company.name||!S.company.ceo) return;
      S.seed = hash(S.company.name + S.company.ceo); S.cur = 0;
      go("recruit"); break;
    case "recruit:add": {
      const name=($("#nName").value||"").trim();
      if(!name){ $("#nName").focus(); return; }
      if(S.trainees.length>=9 || S.money<CONTRACT) return;
      lastGender = $("#nGender").value;
      lastAge = clamp(parseInt($("#nAge").value,10) || 18, 14, 35);
      const on = $("#nPos .chip.on"); lastPos = on ? on.dataset.pos : lastPos;
      S.trainees.push(makeTrainee(name, lastGender, lastPos, lastAge));
      S.money -= CONTRACT; S.costs.contract += CONTRACT;
      save(); render(); setTimeout(()=>{const f=$("#nName"); if(f) f.focus();},30); break;
    }
    case "recruit:undo":
      if(S.trainees.length){ S.trainees.pop(); S.money += CONTRACT; S.costs.contract -= CONTRACT; save(); render(); }
      break;
    case "recruit:done":
      if(S.recruitReturn==="hub"){ S.recruitReturn=null; go("hub"); }
      else if(S.trainees.length>=4){ S.chatter = makeChatter(["vocalL","danceL"], "train"); go("training"); }
      break;
    case "train:close": if(S.trainPlan.length===3) closeTrainWeek(); break;
    case "debut:confirm": {
      syncDebut(); const d=draft();
      if(d.members.length<4||!d.name||!d.fandom||!d.center) return;
      S.group={name:d.name, members:d.members.slice(), center:d.center, fandom:d.fandom, color:d.color};
      document.documentElement.style.setProperty("--fan", d.color);
      S.rivals = makeRivals();
      S.rels   = makeRels(d.members);
      S.chatter = makeChatter(["own","camera"], "promo");
      S.trainees.forEach(t=> t.fat = 12);   // 데뷔 준비 기간 동안 회복
      S.fan = 220 + S.trainees.length*30; S.loyal = 62; S.aware = 4 + DISTRICTS[S.company.district].aw;
      startAlbum();
      phoneOpen = window.innerWidth >= 1080;
      pushPosts("debut", 3);
      go("produce"); break;
    }
    case "album:auto": {
      syncTracks();
      S.album.tracks = S.album.tracks.map(t=> t || autoTitle());
      S.album.title = S.album.tracks[S.album.titleIdx];
      save(); render(); break;
    }
    case "album:even": syncTracks(); evenParts(); save(); render(); break;
    case "produce:done": {
      syncAlbum();
      const cost = Math.round(PROD.reduce((s,p)=>s+TIERS.find(t=>t.id===S.album.tiers[p.id]).cost, 0) * ALBUM_TYPES[S.album.type].cost);
      if(!S.album.tracks.every(t=>t) || cost>S.money) return;
      S.money -= cost; S.costs.prod += cost;
      S.fanAtCycleStart = S.fan;
      S.chatter = makeChatter(["music","own"], "promo");
      go("promo"); break;
    }
    case "promo:close": if(S.promoPlan.length===3) closePromoWeek(); break;
    case "toHub": enterHub(); break;
    case "hub:next": if(!termLeft().expired) nextCycle(); break;
    case "hub:recruit": S.recruitReturn="hub"; go("recruit"); break;
    case "hub:renew": {
      const fee = memberList().length * RENEW_PER_MEMBER;
      if(S.money < fee) return;
      ask({kind:"confirm", kicker:"Contract", title:`${S.contractYears}년 재계약`,
           body:`재계약금 <b>${won(fee)}</b>을 지급하고 계약을 ${S.contractYears}년 연장합니다.`,
           choices:[{label:"재계약한다", note:won(fee)+" 즉시 지급", act:"hub:renew!"}, {label:"취소"}]});
      break;
    }
    case "hub:renew!": {
      const fee = memberList().length * RENEW_PER_MEMBER;
      if(S.money < fee) return;
      S.money -= fee; S.months = 0; S.renewals++; save(); render(); break;
    }
    case "hub:disband":
      ask({kind:"confirm", tone:"bad", kicker:"Contract", title:"계약을 종료할까요?",
           body:"활동을 마무리하고 커리어를 정산합니다. 되돌릴 수 없습니다.",
           choices:[{label:"계약을 종료한다", danger:true, act:"hub:disband!"}, {label:"취소"}]});
      break;
    case "hub:disband!": go("ending"); break;
    case "reset":
      ask({kind:"confirm", tone:"bad", kicker:"Danger zone", title:"처음부터 다시 시작할까요?",
           body:"저장된 기획사, 멤버, 누적 성과가 <b>전부 삭제</b>됩니다. 되돌릴 수 없습니다.",
           choices:[{label:"삭제하고 처음부터", note:"모든 기록이 사라집니다", danger:true, act:"reset!"},
                    {label:"취소"}]});
      break;
    case "reset!":
      wipe(); debutDraft = null; lastGender = "f"; lastPos = "vocal"; lastAge = 18;
      phoneOpen = window.innerWidth >= 1080;
      S = blank(); S.phase = "intro"; save(); render();
      break;
  }
}
function readCompany(){
  const n=$("#fName"), c=$("#fCeo");
  if(n) S.company.name=n.value.trim();
  if(c) S.company.ceo=c.value.trim();
}
function syncDebut(){
  const d=draft(), n=$("#dName"), f=$("#dFandom");
  if(n) d.name=n.value.trim(); if(f) d.fandom=f.value.trim();
}
function syncTracks(){
  if(!S.album) return;
  $$("[data-track]").forEach(inp=>{ S.album.tracks[+inp.dataset.track] = inp.value.trim(); });
  S.album.title = S.album.tracks[S.album.titleIdx] || "";
}
function syncAlbum(){ syncTracks(); }

/* live input echoes */
document.addEventListener("input", e=>{
  const id=e.target.id;
  if(id==="fName"){ S.company.name=e.target.value.trim(); const p=$("#pvName"); if(p)p.textContent=S.company.name||"—"; toggleCta(!!S.company.name&&!!S.company.ceo); $(".co-n").textContent=S.company.name||"IDOL AGENCY"; }
  if(id==="fCeo"){ S.company.ceo=e.target.value.trim(); const p=$("#pvCeo"); if(p)p.textContent=S.company.ceo||"—"; toggleCta(!!S.company.name&&!!S.company.ceo); }
  if(id==="dName"||id==="dFandom"){ syncDebut(); const d=draft(); toggleCta(d.members.length>=4&&!!d.name&&!!d.fandom&&!!d.center); }
  if(e.target.dataset && e.target.dataset.track != null){
    S.album.tracks[+e.target.dataset.track] = e.target.value.trim();
    S.album.title = S.album.tracks[S.album.titleIdx] || "";
    const cost = Math.round(PROD.reduce((s,p)=>s+TIERS.find(t=>t.id===S.album.tiers[p.id]).cost,0) * ALBUM_TYPES[S.album.type].cost);
    toggleCta(S.album.tracks.every(t=>t) && cost<=S.money);
  }
  if(e.target.dataset && e.target.dataset.part){
    rebalanceParts(e.target.dataset.part, +e.target.value);
    save(); render();
  }
});
function toggleCta(ok){ const b=$(".cta .btn.primary"); if(b) b.disabled=!ok; }

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && document.activeElement && document.activeElement.id==="nName"){
    e.preventDefault(); const b=document.querySelector('[data-act="recruit:add"]'); if(b&&!b.disabled) b.click();
  }
});

let wasWide = window.innerWidth >= 1080;
window.addEventListener("resize", ()=>{
  const wide = window.innerWidth >= 1080;
  if(wasWide && !wide && phoneOpen) phoneOpen = false;   // 좁아지면 보드를 가리지 않도록
  wasWide = wide; drawPhone();
});
$("#phClose").addEventListener("click", ()=>{ phoneOpen=false; drawPhone(); });
$("#phoneBtn").addEventListener("click", ()=>{ phoneOpen=true; S.unread=0; drawPhone(); });

/* ================= boot ================= */
S = blank();
const saved = loadSave();
if(saved && saved.phase !== "intro"){ /* keep intro; 이어하기 restores */ }
render();
</script>
</body>
</html>
