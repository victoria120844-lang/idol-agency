<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="소형 기획사를 운영해 아이돌 그룹을 데뷔시키는 브라우저 시뮬레이션 게임. 설치도 로그인도 없이 바로 플레이." />
    <title>IDOL AGENCY SIMULATOR · 소형 기획사 운영 시뮬레이터</title>

    <!-- Open Graph / Twitter. Relative image path so it resolves from any
         subpath the build is hosted under. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IDOL AGENCY SIMULATOR" />
    <meta property="og:title" content="IDOL AGENCY SIMULATOR · 소형 기획사 운영 시뮬레이터" />
    <meta
      property="og:description"
      content="자본금 5,000,000원. 연습생을 뽑고, 데뷔조를 짜고, 4주간의 컴백을 버텨내세요. 설치도 로그인도 없습니다."
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IDOL AGENCY SIMULATOR · 소형 기획사 운영 시뮬레이터" />
    <meta
      name="twitter:description"
      content="자본금 5,000,000원으로 시작하는 아이돌 기획사 경영 시뮬레이터. 브라우저에서 바로 플레이."
    />
    <meta name="twitter:image" content="./og.png" />

    <!-- Korean UI face. Dynamic subset keeps the payload small. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- Tabular figures for money, stats and chart numbers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
